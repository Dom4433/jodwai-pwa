<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>จดไว</title>
<meta name="description" content="จดรายรับรายจ่ายแบบปัดนิ้ว ใช้งานได้แม้ไม่มีอินเทอร์เน็ต">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#E6ECF1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121A22" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="จดไว">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bai+Jamjuree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E6ECF1; --panel:#F6F8FA; --ink:#1C2733; --muted:#6A7886;
  --key:#FFFFFF; --key-press:#D5DEE6; --key-ink:#1C2733;
  --in:#178A57; --in-soft:#D3F0E1; --out:#D2392F; --out-soft:#FADAD6;
  --line:#CBD5DE;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121A22; --panel:#1A242E; --ink:#E8EEF3; --muted:#8C9AA8;
    --key:#24303B; --key-press:#33424F; --key-ink:#E8EEF3;
    --in:#3CC487; --in-soft:#173A2A; --out:#FF6B5E; --out-soft:#45201D;
    --line:#2C3946; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121A22; --panel:#1A242E; --ink:#E8EEF3; --muted:#8C9AA8;
  --key:#24303B; --key-press:#33424F; --key-ink:#E8EEF3;
  --in:#3CC487; --in-soft:#173A2A; --out:#FF6B5E; --out-soft:#45201D;
  --line:#2C3946; color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  height:100%;margin:0;background:var(--bg);color:var(--ink);
  font-family:"Bai Jamjuree","Noto Sans Thai","Leelawadee UI",Tahoma,sans-serif;
  -webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;
  overscroll-behavior:none;
}
.app{
  height:100%;max-width:480px;margin:0 auto;display:flex;flex-direction:column;
  padding:12px 14px 14px;gap:12px;
}

/* ---------- Top: today's total ---------- */
.top{padding:6px 6px 0}
.top-row{display:flex;justify-content:space-between;align-items:baseline}
.date{font-size:15px;color:var(--muted);font-weight:500}
.reset{background:none;border:0;color:var(--muted);font:inherit;font-size:14px;padding:6px 8px;border-radius:8px;cursor:pointer}
.reset:focus-visible{outline:2px solid var(--ink)}
.total{
  font-size:clamp(40px,12vw,56px);font-weight:700;line-height:1.1;
  font-variant-numeric:tabular-nums;letter-spacing:-.5px;margin-top:2px;
  transition:color .3s;
}
.total.pos{color:var(--in)} .total.neg{color:var(--out)}
.total .cur{font-size:.5em;font-weight:500;margin-right:4px;color:var(--muted)}
.split{display:flex;gap:16px;font-size:15px;margin-top:4px;font-variant-numeric:tabular-nums}
.split .i{color:var(--in)} .split .o{color:var(--out)}
.last{
  margin-top:8px;display:flex;align-items:center;gap:8px;min-height:32px;font-size:14px;color:var(--muted)
}
.last .amt{font-weight:600;font-variant-numeric:tabular-nums}
.last .amt.in{color:var(--in)} .last .amt.out{color:var(--out)}
.undo{
  margin-left:auto;border:1px solid var(--line);background:transparent;color:var(--ink);
  font:inherit;font-size:14px;padding:5px 12px;border-radius:999px;cursor:pointer
}
.undo:focus-visible{outline:2px solid var(--ink)}

/* ---------- Middle: swipe display ---------- */
.stage{
  position:relative;flex:1 1 auto;min-height:150px;border-radius:22px;
  background:var(--panel);overflow:hidden;touch-action:none;cursor:grab;
  display:flex;align-items:center;justify-content:center;
  border:1.5px dashed var(--line);
}
.stage:active{cursor:grabbing}
.tint{position:absolute;inset:0;opacity:0;pointer-events:none;transition:opacity .15s}
.tint.in{background:var(--in-soft)} .tint.out{background:var(--out-soft)}
.hint{
  position:absolute;bottom:12px;font-size:14px;color:var(--muted);font-weight:500;
  transition:color .15s,transform .15s;
}
.hint.l{left:16px} .hint.r{right:16px}
.hint.l.on{color:var(--out);transform:translateX(-3px)}
.hint.r.on{color:var(--in);transform:translateX(3px)}
.num{
  position:relative;font-size:clamp(52px,17vw,80px);font-weight:700;
  font-variant-numeric:tabular-nums;letter-spacing:-1px;color:var(--ink);
  white-space:nowrap;will-change:transform;transition:color .12s;
  max-width:92%;overflow:hidden;text-overflow:ellipsis;
}
.num.empty{color:var(--line)}
.num.in{color:var(--in)} .num.out{color:var(--out)}
.num.fly{transition:transform .32s cubic-bezier(.5,0,.75,0),opacity .32s}
.num.back{transition:transform .25s cubic-bezier(.2,.9,.3,1.2),color .12s}
.num.pop{animation:pop .22s ease-out}
@keyframes pop{from{transform:scale(.9);opacity:.3}to{transform:none;opacity:1}}
.toast{
  position:absolute;top:14px;left:50%;transform:translate(-50%,-8px);opacity:0;
  font-size:15px;font-weight:600;padding:6px 14px;border-radius:999px;
  transition:opacity .2s,transform .2s;pointer-events:none;
}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.in{background:var(--in);color:#fff} .toast.out{background:var(--out);color:#fff}

/* ---------- Bottom: numpad ---------- */
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;flex:0 0 auto}
.k{
  height:clamp(56px,9.5vh,76px);border:0;border-radius:18px;background:var(--key);color:var(--key-ink);
  font:inherit;font-size:30px;font-weight:600;cursor:pointer;touch-action:manipulation;
  box-shadow:0 2px 0 var(--line);transition:background .08s,transform .08s;
}
.k:active,.k.press{background:var(--key-press);transform:translateY(2px);box-shadow:none}
.k:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.k.fn{background:transparent;box-shadow:none;font-size:26px;color:var(--muted)}
.k.fn:active{background:var(--key-press)}
.k svg{width:30px;height:30px;vertical-align:middle}

/* ---------- PWA banner ---------- */
.banner{
  position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom,0px));transform:translate(-50%,140%);
  width:min(452px,calc(100% - 28px));display:flex;align-items:center;gap:10px;
  background:var(--ink);color:var(--bg);padding:10px 10px 10px 16px;border-radius:16px;
  font-size:15px;transition:transform .3s ease;z-index:10;
}
.banner.show{transform:translate(-50%,0)}
.banner span{flex:1}
.banner button{font:inherit;font-size:15px;font-weight:600;border:0;border-radius:10px;padding:8px 14px;cursor:pointer}
.banner .go{background:var(--bg);color:var(--ink)}
.banner .x{background:transparent;color:var(--bg);opacity:.7;padding:8px 10px}
.offline{font-size:13px;color:var(--muted);margin-left:8px}
@media (prefers-reduced-motion: reduce){
  .banner{transition:none}
  .num.fly,.num.back,.num.pop,.toast,.hint{transition:none;animation:none}
}
@media (min-height:820px){.k{height:80px}}
</style>
</head>
<body>
<div class="app">

  <!-- Top -->
  <section class="top" aria-label="ยอดรวมวันนี้">
    <div class="top-row">
      <span class="date"><span id="date"></span><span class="offline" id="offline" hidden>· ออฟไลน์</span></span>
      <button class="reset" id="reset" type="button">ล้างวันนี้</button>
    </div>
    <div class="total" id="total" aria-live="polite"><span class="cur">฿</span>0</div>
    <div class="split">
      <span class="i" id="sumIn">รับ +0</span>
      <span class="o" id="sumOut">จ่าย −0</span>
    </div>
    <div class="last" id="last">พิมพ์ตัวเลข แล้วปัดเพื่อบันทึก</div>
  </section>

  <!-- Middle -->
  <section class="stage" id="stage" aria-label="ตัวเลขที่กำลังพิมพ์ ปัดขวาเป็นรายรับ ปัดซ้ายเป็นรายจ่าย">
    <div class="tint in" id="tintIn"></div>
    <div class="tint out" id="tintOut"></div>
    <div class="toast" id="toast"></div>
    <div class="num empty" id="num">0</div>
    <span class="hint l" id="hintL">‹ รายจ่าย</span>
    <span class="hint r" id="hintR">รายรับ ›</span>
  </section>

  <!-- Bottom -->
  <section class="pad" id="pad" aria-label="แป้นตัวเลข">
    <button class="k" data-k="1" type="button">1</button>
    <button class="k" data-k="2" type="button">2</button>
    <button class="k" data-k="3" type="button">3</button>
    <button class="k" data-k="4" type="button">4</button>
    <button class="k" data-k="5" type="button">5</button>
    <button class="k" data-k="6" type="button">6</button>
    <button class="k" data-k="7" type="button">7</button>
    <button class="k" data-k="8" type="button">8</button>
    <button class="k" data-k="9" type="button">9</button>
    <button class="k fn" data-k="." type="button" aria-label="จุดทศนิยม">.</button>
    <button class="k" data-k="0" type="button">0</button>
    <button class="k fn" data-k="del" type="button" aria-label="ลบ (กดค้างเพื่อล้าง)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 5H9l-6 7 6 7h12a1 1 0 0 0 1-1V6a1 1 0 0 0-1-1z"/><path d="M17 9l-5 6M12 9l5 6"/></svg>
    </button>
  </section>
</div>

<div class="banner" id="banner" role="status">
  <span id="bannerText"></span>
  <button class="go" id="bannerGo" type="button"></button>
  <button class="x" id="bannerX" type="button" aria-label="ปิด">✕</button>
</div>

<script>
(function(){
  const $ = id => document.getElementById(id);
  const numEl=$('num'), stage=$('stage'), tintIn=$('tintIn'), tintOut=$('tintOut');
  const hintL=$('hintL'), hintR=$('hintR'), toast=$('toast');
  const MAX_DIGITS = 9;

  // ---------- Date & storage ----------
  const today = new Date();
  const dayKey = 'jodwai:' + today.getFullYear()+'-'+(today.getMonth()+1)+'-'+today.getDate();
  $('date').textContent = today.toLocaleDateString('th-TH',{weekday:'long',day:'numeric',month:'long'});

  let entries = [];
  try { const raw = localStorage.getItem(dayKey); if (raw) entries = JSON.parse(raw) || []; } catch(e){ entries = []; }
  function save(){ try { localStorage.setItem(dayKey, JSON.stringify(entries)); } catch(e){} }

  // ---------- Formatting ----------
  const fmt = n => n.toLocaleString('th-TH',{minimumFractionDigits:0,maximumFractionDigits:2});
  function fmtInput(s){
    if(!s) return '0';
    const [a,b] = s.split('.');
    const intPart = Number(a||'0').toLocaleString('en-US');
    return b!==undefined ? intPart+'.'+b : intPart;
  }

  // ---------- Render ----------
  let input = '';
  function renderInput(){
    numEl.textContent = fmtInput(input);
    numEl.classList.toggle('empty', !input);
  }
  function renderTotals(){
    let inc=0, out=0;
    entries.forEach(e => e.t==='in' ? inc+=e.v : out+=e.v);
    const net = inc-out;
    const t=$('total');
    t.innerHTML = '<span class="cur">฿</span>' + (net<0?'−':'') + fmt(Math.abs(net));
    t.classList.toggle('pos', net>0); t.classList.toggle('neg', net<0);
    $('sumIn').textContent = 'รับ +' + fmt(inc);
    $('sumOut').textContent = 'จ่าย −' + fmt(out);
    const last=$('last');
    if(entries.length){
      const e = entries[entries.length-1];
      last.innerHTML = 'ล่าสุด <span class="amt '+e.t+'">'+(e.t==='in'?'+':'−')+fmt(e.v)+'</span> · '+entries.length+' รายการ'
        + '<button class="undo" id="undo" type="button">ย้อนกลับ</button>';
      $('undo').onclick = undo;
    } else {
      last.textContent = 'พิมพ์ตัวเลข แล้วปัดเพื่อบันทึก';
    }
  }

  // ---------- Input ----------
  function press(k){
    if(k==='del'){ input = input.slice(0,-1); }
    else if(k==='.'){
      if(input.includes('.')) return;
      input = (input||'0') + '.';
    } else {
      const [a,b] = input.split('.');
      if(b!==undefined && b.length>=2) return;
      if(b===undefined && (a||'').length>=MAX_DIGITS) return;
      if(input==='0') input='';
      input += k;
    }
    renderInput();
    if(navigator.vibrate) try{navigator.vibrate(8)}catch(e){}
  }
  function clearInput(){ input=''; renderInput(); }

  const pad=$('pad');
  pad.addEventListener('click', e=>{
    const b=e.target.closest('.k'); if(!b) return;
    if(b.dataset.k==='del' && longFired){ longFired=false; return; }
    press(b.dataset.k);
  });
  // long press backspace = clear
  let longTimer=null, longFired=false;
  const delKey = pad.querySelector('[data-k="del"]');
  delKey.addEventListener('pointerdown', ()=>{ longFired=false; longTimer=setTimeout(()=>{longFired=true;clearInput();},500); });
  ['pointerup','pointerleave','pointercancel'].forEach(ev=>delKey.addEventListener(ev,()=>clearTimeout(longTimer)));

  // ---------- Commit ----------
  function showToast(type, v){
    toast.className = 'toast '+type;
    toast.textContent = (type==='in'?'บันทึกรายรับ +':'บันทึกรายจ่าย −') + fmt(v);
    requestAnimationFrame(()=>toast.classList.add('show'));
    clearTimeout(showToast._t);
    showToast._t = setTimeout(()=>toast.classList.remove('show'), 1300);
  }
  function commit(type){
    const v = parseFloat(input);
    if(!v || v<=0) return false;
    entries.push({t:type, v:Math.round(v*100)/100, at:Date.now()});
    save(); renderTotals(); showToast(type, v);
    if(navigator.vibrate) try{navigator.vibrate(20)}catch(e){}
    return true;
  }
  function undo(){
    if(!entries.length) return;
    entries.pop(); save(); renderTotals();
  }
  $('reset').onclick = ()=>{
    if(!entries.length) return;
    if(confirm('ล้างรายการทั้งหมดของวันนี้?')){ entries=[]; save(); renderTotals(); }
  };

  // ---------- Swipe gesture ----------
  let startX=0, startY=0, dx=0, dragging=false, pid=null;
  const threshold = () => Math.min(110, stage.clientWidth*0.25);

  function setDragVisual(x){
    const th = threshold();
    const p = Math.min(1, Math.abs(x)/th);
    numEl.style.transform = 'translateX('+x+'px) rotate('+(x/40)+'deg)';
    numEl.classList.toggle('in', x>12);
    numEl.classList.toggle('out', x<-12);
    tintIn.style.opacity = x>0 ? p : 0;
    tintOut.style.opacity = x<0 ? p : 0;
    hintR.classList.toggle('on', x>=th);
    hintL.classList.toggle('on', x<=-th);
  }
  function resetVisual(animate){
    numEl.classList.remove('fly','in','out');
    if(animate){ numEl.classList.add('back'); setTimeout(()=>numEl.classList.remove('back'),260); }
    numEl.style.transform=''; numEl.style.opacity='';
    tintIn.style.opacity=0; tintOut.style.opacity=0;
    hintL.classList.remove('on'); hintR.classList.remove('on');
  }

  function flyOut(type){
    const dir = type==='in'?1:-1;
    numEl.classList.remove('back'); numEl.classList.add('fly', type);
    numEl.style.transform = 'translateX('+(dir*stage.clientWidth)+'px) rotate('+(dir*14)+'deg)';
    numEl.style.opacity = '0';
    setTimeout(()=>{
      commit(type);
      input=''; renderInput(); resetVisual(false);
      numEl.classList.add('pop'); setTimeout(()=>numEl.classList.remove('pop'),230);
    }, 300);
  }

  stage.addEventListener('pointerdown', e=>{
    if(!input || parseFloat(input)<=0){ nudge(); return; }
    dragging=true; pid=e.pointerId; startX=e.clientX; startY=e.clientY; dx=0;
    numEl.classList.remove('back','fly');
    stage.setPointerCapture(pid);
  });
  stage.addEventListener('pointermove', e=>{
    if(!dragging || e.pointerId!==pid) return;
    dx = e.clientX-startX;
    setDragVisual(dx);
  });
  function endDrag(e){
    if(!dragging || (e && e.pointerId!==pid)) return;
    dragging=false;
    const th = threshold();
    if(dx>=th) flyOut('in');
    else if(dx<=-th) flyOut('out');
    else resetVisual(true);
  }
  stage.addEventListener('pointerup', endDrag);
  stage.addEventListener('pointercancel', endDrag);

  function nudge(){
    numEl.classList.add('back');
    numEl.style.transform='translateX(10px)';
    setTimeout(()=>{numEl.style.transform='';},120);
    setTimeout(()=>numEl.classList.remove('back'),300);
  }

  // ---------- Keyboard (desktop) ----------
  document.addEventListener('keydown', e=>{
    if(e.key>='0' && e.key<='9') press(e.key);
    else if(e.key==='.'||e.key===',') press('.');
    else if(e.key==='Backspace') press('del');
    else if(e.key==='Escape') clearInput();
    else if(e.key==='ArrowRight' && parseFloat(input)>0) flyOut('in');
    else if(e.key==='ArrowLeft' && parseFloat(input)>0) flyOut('out');
    else return;
    e.preventDefault();
  });

  renderInput(); renderTotals();

  // ---------- PWA: offline badge ----------
  const off=$('offline');
  const net=()=>{ off.hidden = navigator.onLine; };
  addEventListener('online',net); addEventListener('offline',net); net();

  // ---------- PWA: banner helper ----------
  const banner=$('banner');
  function showBanner(text, action, onGo){
    $('bannerText').textContent=text; $('bannerGo').textContent=action;
    $('bannerGo').onclick=()=>{ banner.classList.remove('show'); onGo(); };
    $('bannerX').onclick=()=>banner.classList.remove('show');
    banner.classList.add('show');
  }

  // ---------- PWA: install prompt (Android / Chrome / Edge) ----------
  let deferred=null;
  const isStandalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone;
  addEventListener('beforeinstallprompt', e=>{
    e.preventDefault(); deferred=e;
    if(!isStandalone) showBanner('ติดตั้งจดไวไว้ที่หน้าจอโฮม','ติดตั้ง', async ()=>{
      deferred.prompt(); await deferred.userChoice; deferred=null;
    });
  });
  // iOS Safari ไม่มี prompt อัตโนมัติ จึงบอกวิธีครั้งเดียว
  const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
  let iosTold=false; try{ iosTold = localStorage.getItem('jodwai:iosTip')==='1'; }catch(e){}
  if(isIOS && !isStandalone && !iosTold){
    setTimeout(()=>showBanner('กดปุ่มแชร์ แล้วเลือก "เพิ่มไปยังหน้าจอโฮม"','เข้าใจแล้ว', ()=>{
      try{ localStorage.setItem('jodwai:iosTip','1'); }catch(e){}
    }),1500);
  }

  // ---------- PWA: service worker + update ----------
  if('serviceWorker' in navigator){
    addEventListener('load', async ()=>{
      try{
        const reg = await navigator.serviceWorker.register('sw.js');
        const offerUpdate = w => showBanner('มีเวอร์ชันใหม่','อัปเดต', ()=>w.postMessage('SKIP_WAITING'));
        if(reg.waiting && navigator.serviceWorker.controller) offerUpdate(reg.waiting);
        reg.addEventListener('updatefound', ()=>{
          const w = reg.installing;
          w.addEventListener('statechange', ()=>{
            if(w.state==='installed' && navigator.serviceWorker.controller) offerUpdate(w);
          });
        });
        let reloaded=false;
        navigator.serviceWorker.addEventListener('controllerchange', ()=>{
          if(reloaded) return; reloaded=true; location.reload();
        });
      }catch(err){ console.warn('SW register failed', err); }
    });
  }
})();
</script>
</body>
</html>
